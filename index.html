<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tevmak</title>
<style>
  :root {
    --brand: #c2185b;
    --brand-dark: #8e0e40;
    --bg: #fff8fa;
    --card: #ffffff;
    --text: #2a1b22;
    --muted: #7a6670;
    --line: #f0dbe3;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Bengali", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--card);
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; gap: 12px; flex-wrap: wrap;
  }
  .logo { font-size: 1.3rem; font-weight: 700; color: var(--brand); }
  .header-actions { display: flex; align-items: center; gap: 8px; }
  .cart-btn, .admin-btn {
    background: var(--brand); color: #fff; border: 0;
    padding: 9px 16px; border-radius: 999px; font-size: .95rem; cursor: pointer;
  }
  .admin-btn { background: var(--text); }
  .hero {
    text-align: center; padding: 40px 16px 20px;
    background: linear-gradient(160deg, #fde4ee, #fff8fa);
  }
  .hero h1 { font-size: 1.7rem; margin-bottom: 8px; }
  .hero p { color: var(--muted); max-width: 460px; margin: 0 auto 16px; }
  .search-wrap {
    max-width: 420px; margin: 0 auto; position: relative;
  }
  .search-wrap input {
    width: 100%; padding: 12px 16px 12px 42px;
    border: 1px solid var(--line); border-radius: 999px;
    font: inherit; background: var(--card); outline: none;
  }
  .search-wrap input:focus { border-color: var(--brand); }
  .search-wrap .search-icon {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    color: var(--muted); font-size: 1.1rem; pointer-events: none;
  }
  .filters {
    display: flex; gap: 8px; overflow-x: auto; padding: 16px;
  }
  .chip {
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    padding: 7px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; font-size: .9rem;
  }
  .chip.active { background: var(--brand); color: #fff; border-color: var(--brand); }
  .grid {
    display: grid; gap: 14px; padding: 0 16px 32px;
    grid-template-columns: repeat(2, 1fr);
    max-width: 1000px; margin: 0 auto;
  }
  @media (min-width: 700px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column;
  }
  .thumb {
    aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center;
    font-size: 3rem; background: #fde4ee; position: relative;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .info { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .name { font-size: .95rem; font-weight: 600; }
  .price { color: var(--brand-dark); font-weight: 700; }
  .add {
    margin-top: auto; background: var(--brand); color: #fff; border: 0;
    padding: 9px; border-radius: 10px; cursor: pointer; font-size: .9rem;
  }
  .add:active { background: var(--brand-dark); }
  .no-results {
    grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 40px 16px;
  }

  /* cart + admin drawers share styles */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.4);
    display: none; z-index: 20;
  }
  .overlay.open { display: block; }
  .drawer {
    position: fixed; right: 0; top: 0; bottom: 0; width: min(400px, 100%);
    background: var(--card); z-index: 21; padding: 16px;
    display: none; flex-direction: column;
  }
  .drawer.open { display: flex; }
  .drawer-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px;
  }
  .drawer-header h2 { margin: 0; font-size: 1.2rem; }
  .items { flex: 1; overflow-y: auto; }
  .row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px solid var(--line); gap: 8px;
  }
  .qty { display: flex; align-items: center; gap: 8px; }
  .qty button {
    width: 28px; height: 28px; border-radius: 50%;
    border: 1px solid var(--line); background: #fff; cursor: pointer; font-size: 1rem;
  }
  .total { display: flex; justify-content: space-between; font-weight: 700; padding: 14px 0 8px; }
  .field {
    width: 100%; padding: 10px; margin-bottom: 10px;
    border: 1px solid var(--line); border-radius: 10px; font: inherit;
  }
  .field:focus { outline: none; border-color: var(--brand); }
  label.field-label {
    display: block; font-size: .85rem; color: var(--muted); margin-bottom: 4px;
  }
  .order, .save-btn {
    background: #25d366; color: #fff; border: 0; width: 100%;
    padding: 12px; border-radius: 10px; font-size: 1rem; cursor: pointer; font-weight: 600;
  }
  .save-btn { background: var(--brand); margin-top: 4px; }
  .close { background: none; border: 0; font-size: 1.4rem; cursor: pointer; line-height: 1; }
  .empty { color: var(--muted); text-align: center; padding: 30px 0; }
  .img-preview {
    width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px;
    background: #fde4ee; margin-bottom: 10px; display: none;
  }
  .img-preview.show { display: block; }
  .hint { font-size: .8rem; color: var(--muted); margin-bottom: 10px; }
  footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 24px 16px 40px; }
</style>
</head>
<body>

<header>
  <div class="logo" id="logo">Tevmak</div>
  <div class="header-actions">
    <button class="admin-btn" id="openAdmin">+ Add product</button>
    <button class="cart-btn" id="openCart">Cart (<span id="count">0</span>)</button>
  </div>
</header>

<section class="hero">
  <h1 id="heroTitle">Beautiful things for you</h1>
  <p id="heroText">Browse our collection and order easily on WhatsApp. Delivery all over Bangladesh.</p>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="search" id="search" placeholder="Search products..." autocomplete="off">
  </div>
</section>

<div class="filters" id="filters"></div>
<main class="grid" id="grid"></main>

<footer id="footer"></footer>

<div class="overlay" id="overlay"></div>

<!-- Cart drawer -->
<aside class="drawer" id="drawer">
  <div class="drawer-header">
    <h2>Your cart</h2>
    <button class="close" id="closeCart" aria-label="Close">&times;</button>
  </div>
  <div class="items" id="items"></div>
  <div class="total"><span>Total</span><span id="total">৳0</span></div>
  <input class="field" id="custName" placeholder="Your name">
  <input class="field" id="custPhone" placeholder="Phone number">
  <textarea class="field" id="custAddr" rows="2" placeholder="Delivery address"></textarea>
  <button class="order" id="orderBtn">Order on WhatsApp</button>
</aside>

<!-- Add product drawer -->
<aside class="drawer" id="adminDrawer">
  <div class="drawer-header">
    <h2>Add product</h2>
    <button class="close" id="closeAdmin" aria-label="Close">&times;</button>
  </div>
  <div class="items">
    <p class="hint">Paste an image URL (from Unsplash, Imgur, Google Drive public link, etc.) or leave blank to use an emoji.</p>
    <label class="field-label">Product name</label>
    <input class="field" id="newName" placeholder="e.g. Gold Necklace">
    <label class="field-label">Price (৳)</label>
    <input class="field" id="newPrice" type="number" min="1" placeholder="e.g. 850">
    <label class="field-label">Category</label>
    <input class="field" id="newCategory" placeholder="e.g. Jewelry">
    <label class="field-label">Image URL (optional)</label>
    <input class="field" id="newImage" placeholder="https://...">
    <img class="img-preview" id="imgPreview" alt="Preview">
    <label class="field-label">Emoji fallback (if no image)</label>
    <input class="field" id="newEmoji" placeholder="📿" value="📦">
  </div>
  <button class="save-btn" id="saveProduct">Save product</button>
</aside>

<script>
/* ============ EDIT THIS PART ============ */
const CONFIG = {
  shopName: "Tevmak",
  whatsapp: "8801982359180",   // country code + number, no + or spaces
  currency: "৳",
  heroTitle: "Beautiful things for you",
  heroText: "Browse our collection and order easily on WhatsApp. Delivery all over Bangladesh."
};

// Default products (image URL or "" for emoji)
const DEFAULT_PRODUCTS = [
  {
    id: 1,
    name: "Gold Plated Necklace",
    price: 850,
    category: "Jewelry",
    emoji: "📿",
    image: "https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?w=600&h=600&fit=crop"
  },
  {
    id: 2,
    name: "Pearl Earrings",
    price: 450,
    category: "Jewelry",
    emoji: "✨",
    image: "https://images.unsplash.com/photo-1535632066927-ab7c9ab60908?w=600&h=600&fit=crop"
  },
  {
    id: 3,
    name: "Stone Ring Set",
    price: 600,
    category: "Jewelry",
    emoji: "💍",
    image: "https://images.unsplash.com/photo-1605100804763-247f67b3557e?w=600&h=600&fit=crop"
  },
  {
    id: 4,
    name: "Hair Clip Pack",
    price: 250,
    category: "Accessories",
    emoji: "🎀",
    image: "https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=600&h=600&fit=crop"
  },
  {
    id: 5,
    name: "Hand Bag",
    price: 1450,
    category: "Accessories",
    emoji: "👜",
    image: "https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=600&h=600&fit=crop"
  },
  {
    id: 6,
    name: "Matte Lipstick",
    price: 380,
    category: "Makeup",
    emoji: "💄",
    image: "https://images.unsplash.com/photo-1586495777744-4413f21062fa?w=600&h=600&fit=crop"
  },
  {
    id: 7,
    name: "Eyeshadow Palette",
    price: 720,
    category: "Makeup",
    emoji: "🎨",
    image: "https://images.unsplash.com/photo-1512496015851-a90fb38ba796?w=600&h=600&fit=crop"
  },
  {
    id: 8,
    name: "Compact Mirror",
    price: 220,
    category: "Accessories",
    emoji: "🪞",
    image: "https://images.unsplash.com/photo-1631214524020-7e18db9a8f92?w=600&h=600&fit=crop"
  }
];
/* ========================================= */

let PRODUCTS = [];
let cart = {};
let activeCat = "All";
let searchQuery = "";

// Load products: custom ones from localStorage, else defaults
try {
  const saved = localStorage.getItem("tevmak_products");
  PRODUCTS = saved ? JSON.parse(saved) : [...DEFAULT_PRODUCTS];
} catch (e) {
  PRODUCTS = [...DEFAULT_PRODUCTS];
}
function saveProducts() {
  try { localStorage.setItem("tevmak_products", JSON.stringify(PRODUCTS)); } catch (e) {}
}

try { cart = JSON.parse(localStorage.getItem("cart") || "{}"); } catch (e) { cart = {}; }
function save() { try { localStorage.setItem("cart", JSON.stringify(cart)); } catch (e) {} }

const $ = id => document.getElementById(id);
const money = n => CONFIG.currency + Number(n).toLocaleString("en-US");

document.title = CONFIG.shopName;
$("logo").textContent = CONFIG.shopName;
$("heroTitle").textContent = CONFIG.heroTitle;
$("heroText").textContent = CONFIG.heroText;
$("footer").textContent = "© " + new Date().getFullYear() + " " + CONFIG.shopName;

function renderFilters() {
  const cats = ["All", ...new Set(PRODUCTS.map(p => p.category))];
  $("filters").innerHTML = "";
  cats.forEach(c => {
    const b = document.createElement("button");
    b.className = "chip" + (c === activeCat ? " active" : "");
    b.textContent = c;
    b.onclick = () => { activeCat = c; renderFilters(); renderGrid(); };
    $("filters").appendChild(b);
  });
}

function filteredList() {
  const q = searchQuery.trim().toLowerCase();
  return PRODUCTS.filter(p => {
    const catOk = activeCat === "All" || p.category === activeCat;
    const searchOk = !q || p.name.toLowerCase().includes(q) || (p.category || "").toLowerCase().includes(q);
    return catOk && searchOk;
  });
}

function renderGrid() {
  const list = filteredList();
  $("grid").innerHTML = "";
  if (!list.length) {
    $("grid").innerHTML = '<div class="no-results">No products found</div>';
    return;
  }
  list.forEach(p => {
    const card = document.createElement("div");
    card.className = "card";
    const thumb = p.image
      ? `<img src="${p.image}" alt="${p.name}" loading="lazy" onerror="this.style.display='none';this.parentNode.textContent='${p.emoji || "📦"}'">`
      : (p.emoji || "📦");
    card.innerHTML = `
      <div class="thumb">${thumb}</div>
      <div class="info">
        <div class="name">${p.name}</div>
        <div class="price">${money(p.price)}</div>
        <button class="add">Add to cart</button>
      </div>`;
    card.querySelector(".add").onclick = () => addToCart(p.id);
    $("grid").appendChild(card);
  });
}

function addToCart(id) {
  cart[id] = (cart[id] || 0) + 1;
  save(); renderCart();
}
function changeQty(id, d) {
  cart[id] = (cart[id] || 0) + d;
  if (cart[id] <= 0) delete cart[id];
  save(); renderCart();
}

function cartLines() {
  return Object.keys(cart).map(id => {
    const p = PRODUCTS.find(x => x.id == id);
    return p ? { p, qty: cart[id] } : null;
  }).filter(Boolean);
}

function renderCart() {
  const lines = cartLines();
  const count = lines.reduce((s, l) => s + l.qty, 0);
  const total = lines.reduce((s, l) => s + l.qty * l.p.price, 0);
  $("count").textContent = count;
  $("total").textContent = money(total);
  if (!lines.length) {
    $("items").innerHTML = '<div class="empty">Your cart is empty</div>';
    return;
  }
  $("items").innerHTML = "";
  lines.forEach(({ p, qty }) => {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `
      <div><div>${p.name}</div><small>${money(p.price)}</small></div>
      <div class="qty"><button>−</button><span>${qty}</span><button>+</button></div>`;
    const [minus, plus] = row.querySelectorAll("button");
    minus.onclick = () => changeQty(p.id, -1);
    plus.onclick = () => changeQty(p.id, 1);
    $("items").appendChild(row);
  });
}

function toggleCart(open) {
  $("drawer").classList.toggle("open", open);
  $("adminDrawer").classList.remove("open");
  $("overlay").classList.toggle("open", open || $("adminDrawer").classList.contains("open"));
}
function toggleAdmin(open) {
  $("adminDrawer").classList.toggle("open", open);
  $("drawer").classList.remove("open");
  $("overlay").classList.toggle("open", open || $("drawer").classList.contains("open"));
  if (open) {
    $("newName").value = "";
    $("newPrice").value = "";
    $("newCategory").value = "";
    $("newImage").value = "";
    $("newEmoji").value = "📦";
    $("imgPreview").classList.remove("show");
    $("imgPreview").src = "";
  }
}

$("openCart").onclick = () => toggleCart(true);
$("closeCart").onclick = () => toggleCart(false);
$("openAdmin").onclick = () => toggleAdmin(true);
$("closeAdmin").onclick = () => toggleAdmin(false);
$("overlay").onclick = () => {
  toggleCart(false);
  toggleAdmin(false);
};

// Live image preview
$("newImage").oninput = () => {
  const url = $("newImage").value.trim();
  const prev = $("imgPreview");
  if (url) {
    prev.src = url;
    prev.classList.add("show");
    prev.onerror = () => prev.classList.remove("show");
  } else {
    prev.classList.remove("show");
    prev.src = "";
  }
};

$("saveProduct").onclick = () => {
  const name = $("newName").value.trim();
  const price = Number($("newPrice").value);
  const category = $("newCategory").value.trim() || "Other";
  const image = $("newImage").value.trim();
  const emoji = $("newEmoji").value.trim() || "📦";
  if (!name) { alert("Please enter a product name."); return; }
  if (!price || price < 1) { alert("Please enter a valid price."); return; }
  const nextId = PRODUCTS.reduce((m, p) => Math.max(m, p.id), 0) + 1;
  PRODUCTS.push({ id: nextId, name, price, category, emoji, image });
  saveProducts();
  activeCat = "All";
  searchQuery = "";
  $("search").value = "";
  renderFilters();
  renderGrid();
  toggleAdmin(false);
  alert("Product added!");
};

// Search
$("search").oninput = () => {
  searchQuery = $("search").value;
  renderGrid();
};

$("orderBtn").onclick = () => {
  const lines = cartLines();
  if (!lines.length) { alert("Your cart is empty."); return; }
  const name = $("custName").value.trim();
  const phone = $("custPhone").value.trim();
  const addr = $("custAddr").value.trim();
  if (!name || !phone || !addr) { alert("Please fill in your name, phone and address."); return; }
  const total = lines.reduce((s, l) => s + l.qty * l.p.price, 0);
  let msg = `New order from ${CONFIG.shopName}\n\n`;
  lines.forEach(({ p, qty }) => { msg += `• ${p.name} x${qty} = ${money(p.price * qty)}\n`; });
  msg += `\nTotal: ${money(total)}\n\nName: ${name}\nPhone: ${phone}\nAddress: ${addr}`;
  window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`, "_blank");
};

renderFilters();
renderGrid();
renderCart();
</script>
</body>
</html>
